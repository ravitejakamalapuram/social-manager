name: deploy
# Every push to main updates the live Apps Script web app in place (same /exec URL).
# Needs the CLASPRC_JSON secret (contents of ~/.clasprc.json after `npx @google/clasp@3.4.1 login`)
# and the SCRIPT_ID repository variable (Apps Script editor > Project Settings > Script ID).
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check && npm test
      - name: Write clasp settings
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ vars.SCRIPT_ID }}
        run: |
          if [ -z "$CLASPRC_JSON" ] || [ -z "$SCRIPT_ID" ]; then echo "::error::Add the CLASPRC_JSON secret and the SCRIPT_ID variable first (see README)"; exit 1; fi
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          printf '{"scriptId":"%s","rootDir":"src"}' "$SCRIPT_ID" > .clasp.json
      - name: Push code
        run: npx -y @google/clasp@3.4.1 push --force
      - name: Update the web app deployment
        run: |
          C="npx -y @google/clasp@3.4.1"
          ID=$($C deployments | grep -v '@HEAD' | grep -oE 'AKfy[A-Za-z0-9_-]+' | head -1 || true)
          if [ -n "$ID" ]; then $C deploy --deploymentId "$ID" --description "main ${GITHUB_SHA::7}"
          else $C deploy --description "main ${GITHUB_SHA::7}"; fi
      - name: Show the link
        run: npx -y @google/clasp@3.4.1 deployments | grep -v '@HEAD'
